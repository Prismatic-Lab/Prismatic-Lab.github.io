<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prismatic Lab</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<iframe
    id="app"
    src="https://rcp-production-5e36.up.railway.app/"
    allow="fullscreen"
></iframe>

<script>
    const iframe = document.getElementById("app");
    window.addEventListener("message", (event) => {

        if (
            event.origin !==
            "https://rcp-production-5e36.up.railway.app"
        ) {
            return;
        }

        const data = event.data;

        if (!data || typeof data !== "object") {
            return;
        }
        if (data.type === "external-navigation") {

            const url = data.url;

            if (typeof url !== "string") {
                return;
            }

            try {
                const target = new URL(url);
                if (
                    target.protocol !== "http:" &&
                    target.protocol !== "https:"
                ) {
                    return;
                }

                window.open(
                    target.href,
                    "_blank",
                    "noopener,noreferrer"
                );

            } catch (e) {
                console.error(
                    "Invalid navigation URL:",
                    url
                );
            }
        }
    });
</script>

</body>
</html>
