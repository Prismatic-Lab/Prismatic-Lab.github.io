<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Prismatic Lab</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

    <meta name="theme-color" content="#0b0b0f">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="Prismatic Lab"
    >
    <link
        rel="apple-touch-icon"
        href="/icons/icon-192.png"
    >

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0b0b0f;
        }

        iframe {
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<iframe
    id="app"
    src="https://rcp-production-5e36.up.railway.app/"
    allow="fullscreen"
></iframe>

<script>
    const APP_ORIGIN =
        "https://rcp-production-5e36.up.railway.app";

    const iframe = document.getElementById("app");

    /*
     * Messages coming from the embedded application.
     */
    window.addEventListener("message", (event) => {
        if (event.origin !== APP_ORIGIN) {
            return;
        }

        const data = event.data;

        if (!data || typeof data !== "object") {
            return;
        }

        if (data.type === "external-navigation") {
            const url = data.url;

            if (typeof url !== "string") {
                return;
            }

            try {
                const target = new URL(url);

                if (
                    target.protocol !== "http:" &&
                    target.protocol !== "https:"
                ) {
                    return;
                }

                window.open(
                    target.href,
                    "_blank",
                    "noopener,noreferrer"
                );

            } catch (error) {
                console.error(
                    "Invalid navigation URL:",
                    url
                );
            }
        }
    });

    /*
     * Service Worker
     */
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js")
                .catch((error) => {
                    console.error(
                        "Service Worker registration failed:",
                        error
                    );
                });
        });
    }
</script>

</body>
</html>
