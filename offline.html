<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b0b0f">

    <title>Veil</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="/icons/icon.svg"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0f;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
        }

        .container {
            width: min(90%, 420px);
            padding: 32px;
        }

        .icon {
            width: 96px;
            height: 96px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0 0 28px;

            color: #8d8d98;
            font-size: 15px;
            line-height: 1.6;
        }

        button {
            appearance: none;

            border: 0;
            border-radius: 12px;

            padding: 13px 24px;

            background: #ffffff;
            color: #0b0b0f;

            font: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="container">

    <img
        class="icon"
        src="/icons/icon.svg"
        alt="Veil"
    >

    <h1>You're offline</h1>

    <p>
        Veil needs an internet connection.
        Check your connection and try again.
    </p>

    <button onclick="location.reload()">
        Reload
    </button>

</div>

</body>
</html>
